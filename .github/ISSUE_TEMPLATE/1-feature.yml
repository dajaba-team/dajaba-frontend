name: ✨ 기능 개발
description: 새 화면, API 연동, 공통 컴포넌트, 리팩터링 등 개발할 일을 등록합니다.
title: "[Feat] "
labels: ["feature"]
body:
    - type: markdown
      attributes:
          value: |
              이슈 하나 = PR 하나가 되도록 작게 쪼개 주세요. 브랜치는 `feat/{Jira 이슈 키}` (예: `feat/SCRUM-21`).

    - type: dropdown
      id: area
      attributes:
          label: 담당 영역
          description: 어느 폴더 작업인가요? (여러 개면 모두 선택)
          multiple: true
          options:
              - auth (로그인·세션)
              - cases (케이스 목록·상세·조사)
              - str (STR 초안·수정·검증)
              - approvals (승인·반려)
              - admin (배치·룰·계정)
              - shared (공통 API·UI·스타일)
              - app (라우터·레이아웃·QueryClient)
              - mocks (MSW·시연 데이터)
              - infra (CI·Vercel·설정)
              - docs
      validations:
          required: true

    - type: textarea
      id: goal
      attributes:
          label: 🎯 목표
          description: 이 일이 끝나면 사용자가 무엇을 할 수 있나요? 한두 줄이면 충분합니다.
          placeholder: 담당 조사역이 REVIEWING 케이스를 상세 화면에서 에스컬레이션할 수 있다.
      validations:
          required: true

    - type: textarea
      id: tasks
      attributes:
          label: 📝 할 일
          description: 체크리스트로 적어 주세요. PR에서 진행 상황을 체크합니다.
          value: |
              - [ ]
              - [ ]
              - [ ] MSW 핸들러·테스트 (정상 1 + 경계 1 + 실패 1)
      validations:
          required: true

    - type: textarea
      id: done
      attributes:
          label: ✅ 완료 조건
          description: 리뷰어가 "됐다"고 판단할 기준. 화면 경로·버튼·에러 처리를 적어 주세요.
          placeholder: |
              - /cases/CASE-2022-000057 에서 담당 조사역에게만 [에스컬레이션] 버튼
              - 409 INVALID_CASE_TRANSITION 이면 안내 후 상세 재조회

    - type: input
      id: api
      attributes:
          label: 🔌 사용하는 API
          description: 백엔드 경로와 확정 여부 (확정 / 〔초안〕)
          placeholder: POST /api/v1/cases/{case_no}/escalate (CASES 명세 v0.5 〔초안〕)

    - type: textarea
      id: refs
      attributes:
          label: 📎 참조 문서 · 안건
          placeholder: 프론트 docs/06_features/cases.md · 백엔드 docs/04_auth_user.md §4 · 안건 11
